    <script>
        /**
         * WebAudio Sound Synthesizer Engine
         * Generates physical keyboard switch sound profiles & cute meows completely procedurally.
         */
        class KeyboardAudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.profile = 'blue';
            }

            init() {
                if (!this.ctx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playKeySound(keyName = '') {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;

                if (this.profile === 'blue') {
                    // Clicky tactile switch: Sharp noise click + resonance pop
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1200 + Math.random() * 400, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.05);

                    // High frequency click burst
                    const noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.015, this.ctx.sampleRate);
                    const output = noiseBuf.getChannelData(0);
                    for (let i = 0; i < noiseBuf.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = noiseBuf;
                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.15, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
                    noise.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);
                    noise.start(now);

                } else if (this.profile === 'red') {
                    // Smooth linear "thock": Low frequency warm bump
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320 + Math.random() * 60, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.06);

                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.07);

                } else if (this.profile === 'brown') {
                    // Tactile warm switch sound
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600 + Math.random() * 150, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.055);

                } else if (this.profile === 'cute') {
                    // Cute pop tone
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    const baseFreq = keyName.length === 1 ? 500 + (keyName.charCodeAt(0) % 20) * 40 : 650;
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.6, now + 0.06);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.075);

                } else if (this.profile === 'retro') {
                    // 8-bit retro arcade beep
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800 + Math.random() * 300, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.045);
                }
            }

            playMeowSound() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.4);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.45);
            }
        }

        // Global State & Configuration
        const config = {
            skin: 'calico',
            accessory: 'none',
            theme: 'cozy',
            rgbMode: 'rainbow',
            soundProfile: 'blue'
        };

        const themes = {
            cozy: {

        const catSkins = {
            calico: { body: '#f8fafc', ears: '#fb923c', patches: ['#f97316', '#334155'], innerEar: '#f472b6', eyes: '#10b981' },
            tuxedo: { body: '#0f172a', ears: '#1e293b', patches: ['#f8fafc'], innerEar: '#f472b6', eyes: '#f59e0b' },
            tabby: { body: '#f97316', ears: '#ea580c', patches: ['#c2410c'], innerEar: '#f472b6', eyes: '#3b82f6' },
            pink: { body: '#fbcfe8', ears: '#f472b6', patches: ['#ffffff'], innerEar: '#db2777', eyes: '#a855f7' },
            cyber: { body: '#06b6d4', ears: '#0891b2', patches: ['#a855f7'], innerEar: '#f43f5e', eyes: '#facc15' },
            void: { body: '#2e1065', ears: '#1e1b4b', patches: ['#7e22ce'], innerEar: '#e879f9', eyes: '#38bdf8' }
        };

        // Standard QWERTY Virtual Keyboard Layout Definition mapped to key codes
        const keyboardLayout = [
            // Row 1: Function / Number Row
            [
                { code: 'Escape', label: 'Esc', w: 1 },
                { code: 'Digit1', label: '1', w: 1 }, { code: 'Digit2', label: '2', w: 1 }, { code: 'Digit3', label: '3', w: 1 },
                { code: 'Digit4', label: '4', w: 1 }, { code: 'Digit5', label: '5', w: 1 }, { code: 'Digit6', label: '6', w: 1 },
                { code: 'Digit7', label: '7', w: 1 }, { code: 'Digit8', label: '8', w: 1 }, { code: 'Digit9', label: '9', w: 1 },
                { code: 'Digit0', label: '0', w: 1 }, { code: 'Minus', label: '-', w: 1 }, { code: 'Equal', label: '=', w: 1 },
                { code: 'Backspace', label: '⌫', w: 1.8 }
            ],
            // Row 2: QWERTY
            [
                { code: 'Tab', label: 'Tab', w: 1.4 },
                { code: 'KeyQ', label: 'Q', w: 1 }, { code: 'KeyW', label: 'W', w: 1 }, { code: 'KeyE', label: 'E', w: 1 },
                { code: 'KeyR', label: 'R', w: 1 }, { code: 'KeyT', label: 'T', w: 1 }, { code: 'KeyY', label: 'Y', w: 1 },
                { code: 'KeyU', label: 'U', w: 1 }, { code: 'KeyI', label: 'I', w: 1 }, { code: 'KeyO', label: 'O', w: 1 },
                { code: 'KeyP', label: 'P', w: 1 }, { code: 'BracketLeft', label: '[', w: 1 }, { code: 'BracketRight', label: ']', w: 1 },
                { code: 'Backslash', label: '\\', w: 1.4 }
            ],
            // Row 3: ASDF
            [
                { code: 'CapsLock', label: 'Caps', w: 1.75 },
                { code: 'KeyA', label: 'A', w: 1 }, { code: 'KeyS', label: 'S', w: 1 }, { code: 'KeyD', label: 'D', w: 1 },
                { code: 'KeyF', label: 'F', w: 1 }, { code: 'KeyG', label: 'G', w: 1 }, { code: 'KeyH', label: 'H', w: 1 },
                { code: 'KeyJ', label: 'J', w: 1 }, { code: 'KeyK', label: 'K', w: 1 }, { code: 'KeyL', label: 'L', w: 1 },
                { code: 'Semicolon', label: ';', w: 1 }, { code: 'Quote', label: "'", w: 1 },
                { code: 'Enter', label: 'Enter', w: 2.05 }
            ],
            // Row 4: ZXCV
            [
                { code: 'ShiftLeft', label: 'Shift', w: 2.25 },
                { code: 'KeyZ', label: 'Z', w: 1 }, { code: 'KeyX', label: 'X', w: 1 }, { code: 'KeyC', label: 'C', w: 1 },
                { code: 'KeyV', label: 'V', w: 1 }, { code: 'KeyB', label: 'B', w: 1 }, { code: 'KeyN', label: 'N', w: 1 },
                { code: 'KeyM', label: 'M', w: 1 }, { code: 'Comma', label: ',', w: 1 }, { code: 'Period', label: '.', w: 1 },
                { code: 'Slash', label: '/', w: 1 },
                { code: 'ShiftRight', label: 'Shift', w: 2.55 }
            ],
            // Row 5: Spacebar & Modifiers
            [
                { code: 'ControlLeft', label: 'Ctrl', w: 1.3 },
                { code: 'MetaLeft', label: 'Win', w: 1.25 },
                { code: 'AltLeft', label: 'Alt', w: 1.25 },
                { code: 'Space', label: 'SPACEBAR', w: 6.25 },
                { code: 'AltRight', label: 'Alt', w: 1.25 },
                { code: 'ControlRight', label: 'Ctrl', w: 1.3 },
                { code: 'ArrowLeft', label: '◄', w: 1 },
                { code: 'ArrowUp', label: '▲', w: 1 },
                { code: 'ArrowDown', label: '▼', w: 1 },
                { code: 'ArrowRight', label: '►', w: 1 }
            ]
        ];

        // Tracking Active Key Presses & Stats
        const activeKeysMap = new Map();
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let isMouseDown = false;

        let totalKeyPressedCount = 0;
        let comboStreak = 0;
        let streakResetTimer = null;
        let keypressTimestamps = [];
        let calculatedWPM = 0;

        // Physical Cat Paws & Mini Mouse Coordinates Interpolation
        const leftPawPos = { x: 0, y: 0 };
        const rightPawPos = { x: 0, y: 0 };
        const miniMousePos = { x: 0, y: 0 };
        let headBlinkTimer = 0;
        let isEyeBlinking = false;

        // Active interaction timestamps & target keys
        let lastTypingTime = 0;
        let lastMouseActiveTime = 0;
        let lastLeftKeyPos = null;
        let lastLeftKeyTime = 0;
        let lastRightKeyPos = null;
        let lastRightKeyTime = 0;

        // Initialize Audio Synthesizer Engine
        const audioEngine = new KeyboardAudioEngine();

        class CatRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.keyRects = new Map(); // Store render coordinates of each virtual key
                this.deskBounds = { x: 0, y: 0, w: 0, h: 0 };
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            draw() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;
                const theme = themes[config.theme];
                const skin = catSkins[config.skin];

                // 1. Draw Environment Background Gradient
                const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
                bgGrad.addColorStop(0, theme.bgGrad[0]);
                bgGrad.addColorStop(0.5, theme.bgGrad[1]);
                bgGrad.addColorStop(1, theme.bgGrad[2]);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                // 2. Draw Desk Mat & Surface
                const deskTopY = height * 0.42;
                ctx.fillStyle = theme.deskColor;
                ctx.beginPath();
                ctx.moveTo(0, deskTopY);
                ctx.lineTo(width, deskTopY);
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();

                // Desk Lighting Shadow / Bevel
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fillRect(0, deskTopY, width, 12);

                // 3. Draw Main Desk Mat Pad (Centered on desk)
                const matW = Math.min(width * 0.88, 1100);
                const matH = Math.min(height * 0.50, 440);
                const matX = (width - matW) / 2;
                const matY = deskTopY + 20;

                ctx.save();
                // Mat Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 25;
                ctx.shadowOffsetY = 10;

                ctx.fillStyle = theme.deskMat;
                ctx.beginPath();
                ctx.roundRect(matX, matY, matW, matH, 20);
                ctx.fill();
                ctx.restore();

                // Mat Border RGB Accent Line
                ctx.strokeStyle = theme.matAccent;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.roundRect(matX + 4, matY + 4, matW - 8, matH - 8, 16);
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // 4. Calculate Layout Dimensions (Keyboard + Dedicated Mousepad)
                const kbW = matW * 0.62;
                const kbH = matH * 0.65;
                const kbX = matX + matW * 0.04;
                const kbY = matY + 90;

                // Dedicated Mousepad Area on the right
                const mousepadX = matX + matW * 0.69;
                const mousepadY = kbY;
                const mousepadW = matW * 0.27;
                const mousepadH = kbH;

                // Draw Dedicated Mousepad
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(mousepadX, mousepadY, mousepadW, mousepadH, 12);
                ctx.fill();
                ctx.stroke();

                // Mousepad Brand Accent lines
                ctx.strokeStyle = theme.matAccent;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.roundRect(mousepadX + 6, mousepadY + 6, mousepadW - 12, mousepadH - 12, 8);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
                ctx.restore();

                // Render Cat Body & Head (Positioned naturally sitting behind controls)
                const catCenterX = kbX + kbW * 0.48;
                const catCenterY = kbY - 55;

                this.drawCatBodyAndHead(catCenterX, catCenterY, skin, mouseX, mouseY);

                // Render Virtual Keyboard
                this.drawVirtualKeyboard(kbX, kbY, kbW, kbH);

                // Calculate mini mouse position based on user's screen cursor ratio
                const ratioX = Math.max(0, Math.min(1, mouseX / width));
                const ratioY = Math.max(0, Math.min(1, mouseY / height));

                const mouseMarginX = 28;
                const mouseMarginY = 32;
                const targetMiniMouseX = mousepadX + mouseMarginX + ratioX * (mousepadW - mouseMarginX * 2);
                const targetMiniMouseY = mousepadY + mouseMarginY + ratioY * (mousepadH - mouseMarginY * 2);

                // Initialize or smooth-interpolate mini mouse position
                if (!miniMousePos.x) {
                    miniMousePos.x = targetMiniMouseX;
                    miniMousePos.y = targetMiniMouseY;
                } else {
                    miniMousePos.x += (targetMiniMouseX - miniMousePos.x) * 0.25;
                    miniMousePos.y += (targetMiniMouseY - miniMousePos.y) * 0.25;
                }

                // Render Physical Mini Mouse on top of mousepad
                this.drawMiniMouse(miniMousePos.x, miniMousePos.y);

                // Render Animated Paws
                this.drawPaws(catCenterX, catCenterY, skin, miniMousePos.x, miniMousePos.y, kbX, kbY, kbW, kbH, mousepadX, mousepadW);
            }

            drawVirtualKeyboard(x, y, w, h) {
                const ctx = this.ctx;

                // Keyboard Case Base
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 8;
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 14);
                ctx.fill();
                ctx.restore();

                // Keyboard Bevel Edge
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                // Calculate Key Sizes
                const rowCount = keyboardLayout.length;
                const padding = 7;
                const availableH = h - padding * (rowCount + 1);
                const keyH = availableH / rowCount;

                this.keyRects.clear();

                // Draw Keys Row by Row
                for (let r = 0; r < rowCount; r++) {
                    const row = keyboardLayout[r];
                    let totalUnits = 0;
                    row.forEach(k => totalUnits += k.w);

                    const availableW = w - padding * 2;
                    const unitW = (availableW - (row.length - 1) * 4) / totalUnits;

                    let currX = x + padding;
                    const currY = y + padding + r * (keyH + padding);

                    for (let c = 0; c < row.length; c++) {
                        const key = row[c];
                        const keyW = key.w * unitW;
                        const isPressed = activeKeysMap.has(key.code);

                        // Key Rect Bounds
                        const keyRect = { x: currX, y: currY, w: keyW, h: keyH, code: key.code, label: key.label };
                        this.keyRects.set(key.code, keyRect);

                        // Key Color Dynamics
                        ctx.save();
                        let keyBg = isPressed ? '#ec4899' : '#1e293b';
                        let textColor = isPressed ? '#ffffff' : '#94a3b8';
                        let shadowColor = isPressed ? '#db2777' : 'rgba(0,0,0,0.3)';

                        // Dynamic RGB Glow for active keys
                        if (isPressed) {
                            ctx.shadowColor = shadowColor;
                            ctx.shadowBlur = 15;
                        }

                        // Draw Key Cap Base
                        ctx.fillStyle = keyBg;
                        ctx.beginPath();
                        const keyPressOffset = isPressed ? 2 : 0;
                        ctx.roundRect(currX, currY + keyPressOffset, keyW, keyH - keyPressOffset, 6);
                        ctx.fill();

                        // Key Cap Top Highlight
                        if (!isPressed) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                            ctx.beginPath();
                            ctx.roundRect(currX + 1, currY + 1, keyW - 2, (keyH - 2) * 0.4, 5);
                            ctx.fill();
                        }

                        // Key Cap Border
                        ctx.strokeStyle = isPressed ? '#f472b6' : '#334155';
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        // Key Label Text
                        ctx.fillStyle = textColor;
                        ctx.font = key.w > 2 ? 'bold 10px JetBrains Mono' : 'bold 11px JetBrains Mono';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(key.label, currX + keyW / 2, currY + keyH / 2 + keyPressOffset);

                        ctx.restore();

                        currX += keyW + 4;
                    }
                }
            }

            drawCatBodyAndHead(centerX, centerY, skin, targetX, targetY) {
                const ctx = this.ctx;

                // 1. Calculate Head Angle & Eye Offset tracking mouse position
                const dx = targetX - centerX;
                const dy = targetY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);

                // Smooth Eye Tracking offset
                const lookLimit = 12;
                const lookX = (dx / (dist + 1)) * lookLimit;
                const lookY = (dy / (dist + 1)) * lookLimit;

                // Eye position constants (declared before usage in cheek blush & eye drawing)
                const eyeSpacing = 32;
                const eyeY = -6;

                ctx.save();

                // Cat Body Torso & Shoulders Silhouette (sitting behind desk mat)
                ctx.fillStyle = skin.body;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY + 45, 85, 55, 0, 0, Math.PI * 2);
                ctx.fill();

                // Rounded Shoulder Bulges
                ctx.beginPath();
                ctx.ellipse(centerX - 48, centerY + 38, 28, 35, -0.3, 0, Math.PI * 2);
                ctx.ellipse(centerX + 48, centerY + 38, 28, 35, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Calico / Fur Patch on Body
                if (skin.patches.length > 0) {
                    ctx.fillStyle = skin.patches[0];
                    ctx.beginPath();
                    ctx.ellipse(centerX - 30, centerY + 45, 25, 30, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- CAT HEAD BASE ---
                ctx.translate(centerX, centerY);
                const headTilt = Math.max(-0.15, Math.min(0.15, lookX * 0.015));
                ctx.rotate(headTilt);

                // Ears (Left & Right)
                const earWidth = 32;
                const earHeight = 45;

                // Left Ear
                ctx.fillStyle = skin.ears;
                ctx.beginPath();
                ctx.moveTo(-65, -35);
                ctx.lineTo(-45, -95);
                ctx.lineTo(-15, -45);
                ctx.closePath();
                ctx.fill();

                // Left Inner Ear
                ctx.fillStyle = skin.innerEar;
                ctx.beginPath();
                ctx.moveTo(-58, -40);
                ctx.lineTo(-45, -82);
                ctx.lineTo(-22, -47);
                ctx.closePath();
                ctx.fill();

                // Right Ear
                ctx.fillStyle = skin.ears;
                ctx.beginPath();
                ctx.moveTo(15, -45);
                ctx.lineTo(45, -95);
                ctx.lineTo(65, -35);
                ctx.closePath();
                ctx.fill();

                // Right Inner Ear
                ctx.fillStyle = skin.innerEar;
                ctx.beginPath();
                ctx.moveTo(22, -47);
                ctx.lineTo(45, -82);
                ctx.lineTo(58, -40);
                ctx.closePath();
                ctx.fill();

                // Main Head Round Shape
                ctx.fillStyle = skin.body;
                ctx.beginPath();
                ctx.ellipse(0, 0, 75, 62, 0, 0, Math.PI * 2);
                ctx.fill();

                // Fur Cheeks Fluff
                ctx.beginPath();
                ctx.ellipse(-70, 10, 20, 15, -0.3, 0, Math.PI * 2);
                ctx.ellipse(70, 10, 20, 15, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Cute Cheek Rosy Blush
                ctx.fillStyle = 'rgba(244, 114, 182, 0.35)';
                ctx.beginPath();
                ctx.ellipse(-eyeSpacing - 6, eyeY + 18, 10, 6, 0, 0, Math.PI * 2);
                ctx.ellipse(eyeSpacing + 6, eyeY + 18, 10, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tabby / Patch markings on forehead
                if (skin.patches.length > 0) {
                    ctx.fillStyle = skin.patches[0];
                    ctx.beginPath();
                    ctx.ellipse(0, -42, 14, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- CAT EYES (Expressive tracking) ---
                const eyeRadiusX = 14;
                const eyeRadiusY = 16;

                // Handle Periodic Blinking
                headBlinkTimer += 0.016;
                if (headBlinkTimer > 3.5) {
                    isEyeBlinking = true;
                    if (headBlinkTimer > 3.65) {
                        isEyeBlinking = false;
                        headBlinkTimer = 0;
                    }
                }

                if (isEyeBlinking) {
                    // Closed Happy Sleeping Eyes
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.arc(-eyeSpacing, eyeY, 12, 0.2, Math.PI - 0.2);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(eyeSpacing, eyeY, 12, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                } else {
                    // Left Eye Sclera & Pupil
                    ctx.fillStyle = skin.eyes;
                    ctx.beginPath();
                    ctx.ellipse(-eyeSpacing, eyeY, eyeRadiusX, eyeRadiusY, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupil Left
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.ellipse(-eyeSpacing + lookX * 0.4, eyeY + lookY * 0.4, 7, 12, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye Catchlight Sparkle
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-eyeSpacing + lookX * 0.4 - 3, eyeY + lookY * 0.4 - 4, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Right Eye Sclera & Pupil
                    ctx.fillStyle = skin.eyes;
                    ctx.beginPath();
                    ctx.ellipse(eyeSpacing, eyeY, eyeRadiusX, eyeRadiusY, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupil Right
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.ellipse(eyeSpacing + lookX * 0.4, eyeY + lookY * 0.4, 7, 12, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eye Catchlight Sparkle
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(eyeSpacing + lookX * 0.4 - 3, eyeY + lookY * 0.4 - 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- SNOUT, NOSE & MOUTH ---
                // Pink Nose
                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.moveTo(-5, 12);
                ctx.lineTo(5, 12);
                ctx.lineTo(0, 18);
                ctx.closePath();
                ctx.fill();

                // Cute Mouth Curves: :w
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(-6, 20, 6, 0, Math.PI * 0.85);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(6, 20, 6, Math.PI * 0.15, Math.PI);
                ctx.stroke();

                // Whiskers
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.8;
                // Left Whiskers
                ctx.beginPath(); ctx.moveTo(-45, 12); ctx.lineTo(-85, 4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-45, 18); ctx.lineTo(-88, 20); ctx.stroke();
                // Right Whiskers
                ctx.beginPath(); ctx.moveTo(45, 12); ctx.lineTo(85, 4); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(45, 18); ctx.lineTo(88, 20); ctx.stroke();

                // --- ACCESSORIES RENDER ---
                this.drawAccessories(config.accessory);

                ctx.restore();
            }

            drawAccessories(type) {
                const ctx = this.ctx;
                if (type === 'glasses') {
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3.5;
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';

                    // Left Lens
                    ctx.beginPath(); ctx.arc(-32, -6, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    // Right Lens
                    ctx.beginPath(); ctx.arc(32, -6, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    // Bridge
                    ctx.beginPath(); ctx.moveTo(-12, -6); ctx.lineTo(12, -6); ctx.stroke();

                } else if (type === 'headphones') {
                    // Headset Band arching over top of head
                    ctx.strokeStyle = '#ec4899';
                    ctx.lineWidth = 7;
                    ctx.beginPath();
                    ctx.arc(0, -15, 66, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();

                    // Outer Ear Cups on sides of head
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.roundRect(-76, -42, 20, 44, 10); ctx.fill();
                    ctx.beginPath(); ctx.roundRect(56, -42, 20, 44, 10); ctx.fill();

                    // Inner Cushion Detailing
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath(); ctx.roundRect(-72, -36, 12, 32, 6); ctx.fill();
                    ctx.beginPath(); ctx.roundRect(60, -36, 12, 32, 6); ctx.fill();

                } else if (type === 'party') {
                    // Party Hat Cone
                    ctx.fillStyle = '#ec4899';
                    ctx.beginPath(); ctx.moveTo(0, -110); ctx.lineTo(-25, -50); ctx.lineTo(25, -50); ctx.closePath(); ctx.fill();
                    // Yellow Dots
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath(); ctx.arc(0, -80, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(-10, -60, 4, 0, Math.PI * 2); ctx.fill();
                    // Pom-pom
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.arc(0, -112, 8, 0, Math.PI * 2); ctx.fill();

                } else if (type === 'crown') {
                    // Gold Crown
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.moveTo(-30, -50); ctx.lineTo(-35, -85); ctx.lineTo(-15, -65);
                    ctx.lineTo(0, -90); ctx.lineTo(15, -65); ctx.lineTo(35, -85);
                    ctx.lineTo(30, -50); ctx.closePath(); ctx.fill();
                    // Jewels
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath(); ctx.arc(0, -60, 4, 0, Math.PI * 2); ctx.fill();

                } else if (type === 'nekoEars') {
                    // Neon RGB Cat Ear Extensions
                    ctx.strokeStyle = '#22d3ee';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.moveTo(-50, -50); ctx.lineTo(-45, -90); ctx.lineTo(-25, -55); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(25, -55); ctx.lineTo(45, -90); ctx.lineTo(50, -50); ctx.stroke();
                }
            }

            drawMiniMouse(x, y) {
                const ctx = this.ctx;
                ctx.save();

                // Physical Ergonomic Mini Mouse Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;

                // Mouse Body
                const mousePressY = isMouseDown ? 2 : 0;
                ctx.fillStyle = isMouseDown ? '#ec4899' : '#f8fafc';
                ctx.beginPath();
                ctx.ellipse(x, y + mousePressY, 18, 25, 0, 0, Math.PI * 2);
                ctx.fill();

                // Mouse Split Line
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, y - 23 + mousePressY);
                ctx.lineTo(x, y - 8 + mousePressY);
                ctx.stroke();

                // Mouse Scroll Wheel
                ctx.fillStyle = isMouseDown ? '#f472b6' : '#475569';
                ctx.beginPath();
                ctx.roundRect(x - 2, y - 16 + mousePressY, 4, 8, 2);
                ctx.fill();

                // Mouse Glow LED Accent
                ctx.fillStyle = config.theme === 'gamer' ? '#a855f7' : '#ec4899';
                ctx.beginPath();
                ctx.arc(x, y + 14 + mousePressY, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawPaws(catX, catY, skin, miniMouseX, miniMouseY, kbX, kbY, kbW, kbH, mousepadX, mousepadW) {
                const ctx = this.ctx;
                const now = Date.now();

                const isMouseActive = (now - lastMouseActiveTime < 1500) || isMouseDown;
                const isLeftTyping = (now - lastLeftKeyTime < 650);
                const isRightTyping = (now - lastRightKeyTime < 650);

                // --- 1. RESTING POSITIONS (COZY NEAR CAT CHEST AT START / IDLE) ---
                const restLeftX = catX - 42;
                const restLeftY = kbY - 20;

                const restRightX = catX + 42;
                const restRightY = kbY - 20;

                // --- 2. LEFT PAW TARGET CALCULATION ---
                let targetLeftX = restLeftX;
                let targetLeftY = restLeftY;

                if (isLeftTyping && lastLeftKeyPos) {
                    targetLeftX = lastLeftKeyPos.x;
                    targetLeftY = lastLeftKeyPos.y;
                }

                if (!leftPawPos.x) {
                    leftPawPos.x = restLeftX;
                    leftPawPos.y = restLeftY;
                } else {
                    leftPawPos.x += (targetLeftX - leftPawPos.x) * 0.38;
                    leftPawPos.y += (targetLeftY - leftPawPos.y) * 0.38;
                }

                // --- 3. RIGHT PAW TARGET CALCULATION ---
                let targetRightX = restRightX;
                let targetRightY = restRightY;

                if (isMouseActive) {
                    // Right paw actively extends to control mini mouse
                    targetRightX = miniMouseX;
                    targetRightY = miniMouseY - 3;
                } else if (isRightTyping && lastRightKeyPos) {
                    // Mouse idle: Right paw extends to type right side of keyboard
                    targetRightX = lastRightKeyPos.x;
                    targetRightY = lastRightKeyPos.y;
                }

                if (!rightPawPos.x) {
                    rightPawPos.x = restRightX;
                    rightPawPos.y = restRightY;
                } else {
                    rightPawPos.x += (targetRightX - rightPawPos.x) * 0.38;
                    rightPawPos.y += (targetRightY - rightPawPos.y) * 0.38;
                }

                // Shoulders Origin Points on Cat Torso
                const shoulderLeftX = catX - 42;
                const shoulderLeftY = catY + 32;
                const shoulderRightX = catX + 42;
                const shoulderRightY = catY + 32;

                // --- DRAW LEFT PAW & ARM ---
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;

                // Curved Left Arm with natural elbow flex
                const elbowLeftX = (shoulderLeftX + leftPawPos.x) / 2 - 12;
                const elbowLeftY = (shoulderLeftY + leftPawPos.y) / 2 + 10;

                ctx.strokeStyle = skin.body;
                ctx.lineWidth = 26;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(shoulderLeftX, shoulderLeftY);
                ctx.quadraticCurveTo(elbowLeftX, elbowLeftY, leftPawPos.x, leftPawPos.y);
                ctx.stroke();

                // Left Paw Base & Toe Beans
                ctx.fillStyle = skin.body;
                ctx.beginPath();
                ctx.arc(leftPawPos.x, leftPawPos.y, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.arc(leftPawPos.x, leftPawPos.y + 1, 6, 0, Math.PI * 2);
                ctx.fill();
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.arc(leftPawPos.x + i * 6, leftPawPos.y - 6.5, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // --- DRAW RIGHT PAW & ARM ---
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;

                // Curved Right Arm with natural elbow flex
                const elbowRightX = (shoulderRightX + rightPawPos.x) / 2 + 12;
                const elbowRightY = (shoulderRightY + rightPawPos.y) / 2 + 10;

                ctx.strokeStyle = skin.body;
                ctx.lineWidth = 26;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(shoulderRightX, shoulderRightY);
                ctx.quadraticCurveTo(elbowRightX, elbowRightY, rightPawPos.x, rightPawPos.y);
                ctx.stroke();

                // Right Paw Base & Toe Beans
                ctx.fillStyle = skin.body;
                ctx.beginPath();
                ctx.arc(rightPawPos.x, rightPawPos.y, 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.arc(rightPawPos.x, rightPawPos.y + 1, 6, 0, Math.PI * 2);
                ctx.fill();
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.arc(rightPawPos.x + i * 6, rightPawPos.y - 6.5, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        window.onload = function () {
            const canvas = document.getElementById('companionCanvas');
            const renderer = new CatRenderer(canvas);

            function handleResize() {
                renderer.resize();
            }
            window.addEventListener('resize', handleResize);
            handleResize();

            // Track Mouse Movement & Clicks
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                lastMouseActiveTime = Date.now();
            });

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#controlPanel') || e.target.closest('header')) return;
                isMouseDown = true;
                lastMouseActiveTime = Date.now();
                audioEngine.playKeySound('click');
            });

            window.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            // Physical Keyboard Event Handling
            window.addEventListener('keydown', (e) => {
                lastTypingTime = Date.now();
                const now = Date.now();

                // Store pressed key coordinates for cat paw targeting and popup placement
                let keyPos = null;
                const keyRect = renderer.keyRects.get(e.code);
                if (keyRect) {
                    keyPos = {
                        x: keyRect.x + keyRect.w / 2,
                        y: keyRect.y + keyRect.h / 2
                    };

                    const isMouseActive = (now - lastMouseActiveTime < 1500) || isMouseDown;

                    if (isMouseActive) {
                        // Mouse active: Left paw handles the entire keyboard
                        lastLeftKeyPos = keyPos;
                        lastLeftKeyTime = now;
                    } else {
                        // Mouse idle: Divide keyboard between left and right paws
                        let minX = Infinity, maxX = -Infinity;
                        renderer.keyRects.forEach(r => {
                            if (r.x < minX) minX = r.x;
                            if (r.x + r.w > maxX) maxX = r.x + r.w;
                        });
                        const kbCenterX = (minX + maxX) / 2;

                        if (keyPos.x < kbCenterX) {
                            lastLeftKeyPos = keyPos;
                            lastLeftKeyTime = now;
                        } else {
                            lastRightKeyPos = keyPos;
                            lastRightKeyTime = now;
                        }
                    }
                }

                // Prevent key repeat duplicate counts
                if (!activeKeysMap.has(e.code)) {
                    activeKeysMap.set(e.code, true);

                    // Update Statistics & Combo Streaks
                    totalKeyPressedCount++;
                    comboStreak++;
                    document.getElementById('totalKeysCounter').textContent = totalKeyPressedCount;
                    document.getElementById('streakCounter').textContent = comboStreak;

                    // Reset combo streak if idle for 2 seconds
                    clearTimeout(streakResetTimer);
                    streakResetTimer = setTimeout(() => {
                        comboStreak = 0;
                        document.getElementById('streakCounter').textContent = '0';
                    }, 2000);

                    // WPM Speed Tracking
                    const now = Date.now();
                    keypressTimestamps.push(now);
                    // Filter keypresses in the last 10 seconds
                    keypressTimestamps = keypressTimestamps.filter(t => now - t < 10000);
                    calculatedWPM = Math.round((keypressTimestamps.length / 5) * 6);
                    document.getElementById('wpmCounter').textContent = calculatedWPM;

                    // Play Mechanical Switch Sound
                    audioEngine.playKeySound(e.key);

                    // Spawn Visual Floating Key Badge above the exact pressed key
                    spawnKeyBubble(e.key || e.code, keyPos);

                    // Random Meow Easter Egg on Spacebar or Enter
                    if (e.code === 'Space' && Math.random() < 0.15) {
                        audioEngine.playMeowSound();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                activeKeysMap.delete(e.code);
            });

            // Floating Key Badges Spawner
            function spawnKeyBubble(label, keyPos) {
                const container = document.getElementById('keyBubbleContainer');
                const badge = document.createElement('div');
                badge.className = 'key-badge absolute px-3 py-1.5 rounded-xl font-mono text-xs font-bold bg-pink-500/80 text-white shadow-lg backdrop-blur-md border border-white/20 transform -translate-x-1/2';

                // Position directly above the pressed key on the virtual keyboard
                const startX = keyPos ? keyPos.x : (leftPawPos.x || window.innerWidth / 2);
                const startY = keyPos ? keyPos.y : (leftPawPos.y || window.innerHeight / 2);

                badge.style.left = `${startX + (Math.random() - 0.5) * 8}px`;
                badge.style.top = `${startY - 12}px`;
                badge.textContent = label.length === 1 ? label.toUpperCase() : label;

                container.appendChild(badge);

                setTimeout(() => {
                    badge.remove();
                }, 700);
            }

            // Toggle Settings Menu Drawer
            const panel = document.getElementById('controlPanel');
            const toggleBtn = document.getElementById('toggleMenuBtn');
            const closeBtn = document.getElementById('closeMenuBtn');

            function toggleMenu() {
                const isHidden = panel.classList.contains('opacity-0');
                if (isHidden) {
                    panel.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
                    panel.classList.add('opacity-100', 'scale-100');
                } else {
                    panel.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
                    panel.classList.remove('opacity-100', 'scale-100');
                }
            }

            toggleBtn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);

            // Mute / Sound Toggle Button
            const soundBtn = document.getElementById('soundToggleBtn');
            soundBtn.addEventListener('click', () => {
                audioEngine.muted = !audioEngine.muted;
                soundBtn.innerHTML = audioEngine.muted ?
                    '<i class="fa-solid fa-volume-xmark text-slate-500"></i>' :
                    '<i class="fa-solid fa-volume-high text-sm"></i>';
            });

            // Skin Selector Buttons
            document.querySelectorAll('.skin-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.skin-btn').forEach(b => {
                        b.classList.remove('active', 'text-pink-300', 'border-pink-500/50');
                        b.classList.add('text-slate-400');
                    });
                    const target = e.currentTarget;
                    target.classList.add('active', 'text-pink-300', 'border-pink-500/50');
                    config.skin = target.dataset.skin;
                });
            });

            // Accessory Selector Buttons
            document.querySelectorAll('.accessory-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.accessory-btn').forEach(b => {
                        b.classList.remove('active', 'text-pink-300', 'border-pink-500/50');
                        b.classList.add('text-slate-400');
                    });
                    const target = e.currentTarget;
                    target.classList.add('active', 'text-pink-300', 'border-pink-500/50');
                    config.accessory = target.dataset.acc;
                });
            });

            // Theme Environment Selector Buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.theme-btn').forEach(b => {
                        b.classList.remove('active', 'text-pink-300', 'border-pink-500/50');
                        b.classList.add('text-slate-300');
                    });
                    const target = e.currentTarget;
                    target.classList.add('active', 'text-pink-300', 'border-pink-500/50');
                    config.theme = target.dataset.theme;
                });
            });

            // Switch Sound Dropdown
            document.getElementById('switchSoundSelect').addEventListener('change', (e) => {
                audioEngine.profile = e.target.value;
            });

            function animate() {
                renderer.draw();
                requestAnimationFrame(animate);
            }

            // Start Animation Frame Loop
            animate();
        };
    </script>
